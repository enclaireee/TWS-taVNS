<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica,Arial,sans-serif" font-size="14">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#4c2a8a"/></marker></defs>
<style>.b{fill:#f4f0fb;stroke:#4c2a8a;stroke-width:1.5}.s{fill:#fde8e8;stroke:#c0172b;stroke-width:1.5}.t{fill:#1c1330;text-anchor:middle}.m{fill:#6b6580;text-anchor:middle;font-size:12}.l{stroke:#4c2a8a;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<rect class="b" x="20" y="100" width="130" height="60" rx="30"/><text class="t" x="85" y="136">Monitor</text>
<rect class="b" x="300" y="100" width="130" height="60" rx="30"/><text class="t" x="365" y="136">Stim</text>
